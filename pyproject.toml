[project]
name = "azure-functions-doctor"
description = "Diagnostic tool for Azure Functions Python v2 programming model"
keywords = ["azure-functions", "azure", "python", "v2", "diagnostics", "cli", "health-check", "serverless"]
authors = [{ name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
dynamic = ["version"]

dependencies = [
    "jsonschema>=4.18",
    "packaging>=23.2",
    "rich>=13.7",
    "typer>=0.15.4",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://yeongseon.dev/azure-functions-python/doctor/"
Documentation = "https://yeongseon.dev/azure-functions-python/doctor/"
Repository = "https://github.com/yeongseon/azure-functions-doctor-python"
Issues = "https://github.com/yeongseon/azure-functions-doctor-python/issues"
Changelog = "https://github.com/yeongseon/azure-functions-doctor-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "build",
    "coverage",
    "hatch",
    "mypy==2.3.1",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.16.9",
    "requests",
    "types-requests",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-material<10.0",
    "mkdocstrings[python]<2.0",
]

[project.scripts]
azure-functions-doctor = "azure_functions_doctor.cli:main"
# Deprecated aliases (removal targeted for v1.0.0); emit a deprecation notice.
azure-functions = "azure_functions_doctor.cli:azure_functions_alias"
fdoctor = "azure_functions_doctor.cli:fdoctor_alias"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]

[tool.hatch.build.targets.sdist]
# Documentation images and CI config are needed by neither a build nor a test
# run, and dominated the published sdist.
exclude = [
  "**/*.png",
  "**/*.gif",
  "**/*.jpg",
  ".github",
]

[tool.hatch.version]
path = "src/azure_functions_doctor/__init__.py"

[tool.hatch.publish.index]
default = "pypi"

[tool.hatch.publish.index.repos.pypi]
url = "https://upload.pypi.org/legacy/"

[tool.hatch.publish.index.repos.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default]
python = "3.11"
features = ["dev", "docs"]

[tool.hatch.envs.default.scripts]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
style = "ruff check src tests && ruff format --check src tests"
typecheck = "mypy src tests"
lint = "hatch run style && hatch run typecheck"
test = "pytest -v tests"
cov = "pytest --cov-report=term-missing --cov-report=html --cov-report=xml tests/"
e2e-azure = "pytest -v -m e2e tests/e2e/"
docs = "mkdocs serve"
precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
security = "python -m bandit -r src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# C4 + UP keep the codebase on modern syntax (PEP 585/604 generics and
# unions, comprehension forms) instead of the pre-3.10 `typing.List` /
# `Optional[...]` spellings. target-version = "py311" bounds every fix to
# syntax the declared floor supports.
select = ["C4", "E", "F", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["azure_functions_doctor"]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["^tests/fixtures/"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "examples.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--cov=src/azure_functions_doctor --cov-report=xml --cov-report=term-missing -ra -q -m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["src", ".", "examples"]
markers = ["e2e: real Azure end-to-end tests (require E2E_BASE_URL)"]

[tool.coverage.run]
branch = true
source = ["src/azure_functions_doctor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.bandit]
exclude_dirs = ["tests"]
