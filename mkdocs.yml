site_name: Azure Functions Doctor
site_description: A diagnostic tool for Python Azure Functions
site_author: Yeongseon Choe
repo_url: https://github.com/yeongseon/azure-functions-doctor-python
site_url: https://yeongseon.dev/azure-functions-python/doctor/

theme:
  name: material
  logo: logo_assets/logo.png
  favicon: logo_assets/logo_favicon_16px.png
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: getting-started.md
      - Configuration: configuration.md
  - User Guide:
      - CLI Usage: usage.md
      - Deprecated Aliases: deprecated-aliases.md
      - Diagnostics: diagnostics.md
      - Rules: rules.md
      - Deploy-Risk Rule Pages:
          - Python runtime lifecycle: rules/check_python_runtime_lifecycle.md
          - Functions runtime lifecycle: rules/check_functions_runtime_lifecycle.md
          - Hosting plan lifecycle: rules/check_hosting_plan_lifecycle.md
          - Flex runtime config: rules/check_flex_runtime_config.md
          - Flex deprecated app settings: rules/check_flex_deprecated_settings.md
          - Flex deployment storage: rules/check_flex_deployment_storage.md
          - Binding connection resolution: rules/check_binding_connection_resolution.md
          - Functions extension version: rules/check_functions_extension_version.md
          - Linux runtime (linuxFxVersion): rules/check_linux_fx_version.md
          - Dev-storage emulator connection: rules/check_dev_storage_connection.md
          - Pinned requirements: rules/check_unpinned_requirements.md
      - Rule Inventory: rule_inventory.md
      - Minimal Profile: minimal_profile.md
      - JSON Output Contract: json_output_contract.md
      - Handlers: handlers.md
  - Deployment:
      - Choose a Plan: choose-a-plan.md
      - Deploy to Azure: deployment.md
  - Examples:
      - Basic Check: examples/basic_check.md
      - CI Integration: examples/ci_integration.md
      - Custom Rules: examples/custom_rules.md
  - API Reference: api.md
  - Reference:
      - Architecture: architecture.md
      - Supported Versions: supported_versions.md
      - Catalog Operations: catalog_operations.md
      - Comparison vs Official Skill: comparison.md
      - Semver Policy: semver_policy.md
  - Contributing:
      - Development: development.md
      - Testing: testing.md
      - Guidelines: contributing.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Security: security.md
  - Release Process: release_process.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature: true
            show_root_full_path: false
            merge_init_into_class: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yeongseon/azure-functions-doctor
  copyright: |
    © 2026 Yeongseon Choe – MIT Licensed

extra_javascript:
  - https://unpkg.com/mermaid@11.14.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js
