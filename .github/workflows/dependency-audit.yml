name: Dependency Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheel and isolated reporting environments
        run: |
          python -m pip install 'pip-audit==2.10.1' build
          python -m build --wheel
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv --without-pip "$RUNNER_TEMP/runtime"
          python -m pip --python "$RUNNER_TEMP/runtime/bin/python" install "${wheels[0]}"
          python -m venv --without-pip "$RUNNER_TEMP/development"
          python -m pip --python "$RUNNER_TEMP/development/bin/python" install '.[dev]'
      - name: Audit runtime dependencies
        run: |
          site_packages=$("$RUNNER_TEMP/runtime/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          candidate_version=$("$RUNNER_TEMP/runtime/bin/python" -c 'from importlib.metadata import version; print(version("azure-functions-doctor"))')
          make security-audit SECURITY_PYTHON=python AUDIT_SITE_PACKAGES="$site_packages" CANDIDATE_NAME=azure-functions-doctor CANDIDATE_VERSION="$candidate_version" SECURITY_OUTPUT=security-results/runtime
      - name: Audit development dependencies (reporting only)
        if: always()
        continue-on-error: true
        run: |
          site_packages=$("$RUNNER_TEMP/development/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          candidate_version=$("$RUNNER_TEMP/development/bin/python" -c 'from importlib.metadata import version; print(version("azure-functions-doctor"))')
          make security-audit-report SECURITY_PYTHON=python AUDIT_SITE_PACKAGES="$site_packages" CANDIDATE_NAME=azure-functions-doctor CANDIDATE_VERSION="$candidate_version" SECURITY_OUTPUT=security-results/development
      - name: Upload redacted reporting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-report
          path: security-results/**
          if-no-files-found: error
