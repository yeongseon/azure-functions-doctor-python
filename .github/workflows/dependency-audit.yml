name: Dependency Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1" .

      - name: Audit runtime dependencies
        id: runtime
        continue-on-error: true
        run: |
          set +e
          pip-audit --local --format json --output runtime-audit.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Audit development dependencies
        id: development
        continue-on-error: true
        run: |
          set +e
          pip-audit --local --format json --output development-audit.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write audit summary
        env:
          RUNTIME_EXIT_CODE: ${{ steps.runtime.outputs.exit_code }}
          DEVELOPMENT_EXIT_CODE: ${{ steps.development.outputs.exit_code }}
        run: |
          {
            echo "## pip-audit"
            echo
            echo "| Environment | Exit code | Report |"
            echo "| --- | ---: | --- |"
            echo "| Runtime | ${RUNTIME_EXIT_CODE} | \`runtime-audit.json\` |"
            echo "| Development | ${DEVELOPMENT_EXIT_CODE} | \`development-audit.json\` |"
            echo
            echo "Exit code 0 means no known vulnerabilities; findings are currently non-blocking."
            echo
            echo "### Runtime report"
            echo '```json'
            python -m json.tool runtime-audit.json
            echo '```'
            echo
            echo "### Development report"
            echo '```json'
            python -m json.tool development-audit.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
