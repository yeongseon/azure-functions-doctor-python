name: Release Please

# Release-decision layer. Owns version calculation, CHANGELOG.md, the Release PR,
# the tag, and the GitHub Release. It does not publish.
#
#   Conventional-Commit PRs -> main
#        |
#   Release Please  ->  Release PR (version bump + CHANGELOG)
#        |  maintainer merges
#   release commit  ->  tag vX.Y.Z  +  GitHub Release
#        |
#   publish-pypi.yml (started by the tag)
#        build -> lib-tests -> doctor-runtime-gate
#              -> azure-e2e -> PyPI
#
# RELEASE_PLEASE_TOKEN (a fine-grained PAT) is load-bearing, not a convenience.
# The default GITHUB_TOKEN cannot trigger other workflows, which would mean
# (a) the Release PR never runs the required status checks and so could never be
# merged, and (b) the tag would not start publish-pypi.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Maintain Release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Released \`$RELEASE_TAG\`"
            echo
            echo "Commit: \`$RELEASE_SHA\`"
            echo
            echo "The tag has started **Publish to PyPI**, which runs the full gate"
            echo "(build, lib-tests, doctor-runtime-gate, azure-e2e) before"
            echo "uploading. Nothing reaches PyPI until every tier passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the released Action commit
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Advance the v1 Action ref
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git push origin "${RELEASE_SHA}:refs/heads/v1"

      # README.md, llms.txt, llms-full.txt and docs/deployment.md carry hard-coded
      # version strings that scripts/check_docs_consistency.py enforces in CI.
      # Release Please only bumps __version__, so re-run the canonical sync script
      # on the Release PR branch to keep that PR internally consistent.
      - name: Check out the Release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Sync documented version strings on the Release PR
        if: steps.release.outputs.pr
        run: |
          python3 scripts/sync_docs_version.py
          if git diff --quiet; then
            echo "Documented versions already match __version__."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync documented version strings"
          git push

  # Presentation layer only. Rewrites the body of the GitHub Release that Release
  # Please just created into the standard layout (docs/release_process.md) and adds
  # external-contributor credits only; owner bylines are omitted. It never moves tags or edits
  # CHANGELOG.md and runs independently of publish-pypi.yml, so a failure here can
  # not block or alter a release. tools/release_notes.py refuses to write if the
  # new body would drop a PR/commit reference the Release Please body contained.
  standardize-release-notes:
    name: Standardize GitHub Release notes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python3 -m tools.release_notes apply "$RELEASE_TAG"
        continue-on-error: true
