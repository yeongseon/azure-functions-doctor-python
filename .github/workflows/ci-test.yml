name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Lint, type-check, docs-consistency and security run once on a single
  # pinned interpreter (Python 3.11, matching the mypy/ruff target-version in
  # pyproject). These checks are interpreter-agnostic, so fanning them across
  # the test matrix would only duplicate work (#382).
  quality:
    name: Lint, type-check, docs & security (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py
          python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy, strict)
        run: mypy src tests

      - name: Security scan (bandit)
        run: python -m bandit -r src

      - name: Check documentation consistency
        run: |
          python scripts/gen_rule_inventory.py --check
          python scripts/check_docs_consistency.py

  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 is stable and required in this matrix (not allow-fail).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise.
        # Before #382 the whole matrix ran through the Python-pinned
        # hatch env, so 3.11-3.14 were never actually tested. This guard
        # fails loudly if the running interpreter ever drifts from
        # matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # Hatch env). Enforce coverage on the canonical 3.11 cell and run
        # other supported interpreters without duplicating the coverage gate.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest
          else
            pytest --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  ci-required:
    needs:
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - host-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EVAL'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          for job, data in sorted(results.items()):
              print(f"{job}: {data['result']}")
          failed = sorted(j for j, d in results.items() if d["result"] != "success")
          if failed:
              sys.exit(f"::error::Required checks did not all succeed: {failed}")
          print("All gating jobs succeeded.")
          EVAL

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimum declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jsonschema==4.18.0" "packaging==23.2" "rich==13.7.0" "typer==0.12.3" "requests"
          pip install -e ".[dev]" --no-deps
          pip install pytest pytest-cov

      - name: Assert the declared runtime dependency floors are resolved
        run: |
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "jsonschema": "4.18.0",
              "packaging": "23.2",
              "rich": "13.7.0",
              "typer": "0.12.3",
          }
          for dependency, floor in expected.items():
              resolved = version(dependency)
              print(f"resolved {dependency}={resolved}")
              assert resolved == floor
          PY

      - name: Run full suite against minimum dependency lane
        run: pytest --no-cov

  artifact-build:
    name: Build compatibility artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: artifact-build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and CLI smoke (Py 3.11)
    needs: artifact-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel and CLI outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path

          import azure_functions_doctor

          module_path = Path(azure_functions_doctor.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)
          PY
          azure-functions-doctor doctor \
            --path "$CHECKOUT/examples/v2/http-trigger" \
            --profile minimal \
            --format json \
            --output /tmp/doctor-artifact-smoke.json

  host-smoke:
    name: Real Functions host smoke (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install the smoke app in its local environment
        working-directory: tests/host_smoke
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run the installed doctor against the smoke app
        working-directory: tests/host_smoke
        run: .venv/bin/azure-functions-doctor doctor --path .

      - name: Start Azurite and the Functions host
        working-directory: tests/host_smoke
        run: |
          azurite --silent > /tmp/azurite.log 2>&1 &
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          PATH="$PWD/.venv/bin:$PATH" func start --python --port 7071 > /tmp/functions-host.log 2>&1 &

      - name: Call the diagnosed app
        run: |
          for attempt in {1..30}; do
            if grep -Eq "0 functions|Worker failed|Host startup operation has been canceled" /tmp/functions-host.log; then
              cat /tmp/functions-host.log
              exit 1
            fi
            if response="$(curl --fail --silent http://127.0.0.1:7071/api/smoke)"; then
              test "$response" = "doctor-host-smoke"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/functions-host.log
          exit 1
