name: Publish to PyPI

on:
  push:
    # Trigger the workflow on tag pushes matching v* (e.g., v1.0.0)
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example v0.14.0)
        required: true
        type: string

permissions:
  contents: read

# Verify-before-publish gate (see AGENTS.md):
#   build -> lib-tests -> doctor-runtime-gate -> azure-e2e -> publish
# Tiered runtime verification before any PyPI upload:
#   * lib-tests             : the library's own unit suite.
#   * doctor-runtime-gate   : install the candidate wheel, assert the installed version
#                             matches the release, then run the package's own CLI
#                             (`azure-functions-doctor doctor`) against a real example
#                             Function App. Unlike a host-boot smoke, this imports and
#                             exercises this package's primary runtime surface (the
#                             diagnostic CLI) end to end.
#   * azure-e2e            : calls e2e-azure.yml to deploy to real Azure and run the live e2e suite
#                            against the tag being published. Because it runs inside this chain at
#                            the same ref, certification covers the exact published commit by
#                            construction -- no cross-run SHA/freshness matching is required.
# The publish job uploads the EXACT artifact that was tested; it never rebuilds.
# A tag whose gate fails is a failed release candidate: the version stays
# unpublished. Recover by fixing forward and cutting the next patch tag
# (never move a tag that may already have been consumed).
jobs:
  build:
    name: Build & verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check if tag matches __version__
        id: version
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_doctor/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build distribution packages
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  lib-tests:
    name: Library tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Run test suite
        run: hatch run test

  doctor-runtime-gate:
    name: Package runtime gate (doctor CLI against example app, candidate wheel)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: candidate-dist

      - name: Install candidate wheel
        run: |
          WHEEL=$(ls candidate-dist/*.whl | head -n1)
          echo "Installing candidate wheel: $WHEEL"
          pip install "$WHEEL"

      - name: Verify candidate version is under test
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          ACTUAL=$(python -c "import importlib.metadata as m; print(m.version('azure-functions-doctor'))")
          echo "Expected candidate version: $EXPECTED"
          echo "Installed version:          $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error ::Runtime gate is not exercising the candidate wheel ($ACTUAL != $EXPECTED)"
            exit 1
          fi

      - name: Run the installed doctor CLI against the example app
        run: |
          # Exercises the package's primary runtime surface (the diagnostic CLI)
          # from the installed wheel — not the source tree.
          azure-functions-doctor doctor \
            --path examples/v2/http-trigger \
            --profile minimal

  azure-e2e:
    name: Azure release certification
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/e2e-azure.yml
    with:
      ref: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  publish:
    name: Publish to PyPI
    needs: [build, lib-tests, doctor-runtime-gate, azure-e2e]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        # Exception to the SHA-pinning policy: PyPA's official guidance is to
        # consume this action via the `release/v1` channel rather than a commit
        # SHA, so trusted-publisher token issuance keeps working across patch
        # releases. See CONTRIBUTING.md § "GitHub Actions Pinning" for details.
        uses: pypa/gh-action-pypi-publish@release/v1 # pin-exempt: PyPA official publisher (trusted-publisher OIDC); tracks release/v1 by design

  notify-cookbook:
    name: Trigger cookbook e2e re-verification
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      # Cross-repo repository_dispatch needs a token with contents:write on the
      # cookbook repo (GITHUB_TOKEN cannot cross repositories). Supply a PAT or
      # GitHub App token via the COOKBOOK_DISPATCH_TOKEN secret. When it is unset
      # the step is skipped, so missing wiring never fails a release.
      DISPATCH_TOKEN: ${{ secrets.COOKBOOK_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch sibling-release to cookbook
        if: ${{ env.DISPATCH_TOKEN != '' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yeongseon/azure-functions-cookbook-python/dispatches \
            -d "{\"event_type\":\"sibling-release\",\"client_payload\":{\"library\":\"azure-functions-doctor\",\"version\":\"${VERSION}\"}}"
