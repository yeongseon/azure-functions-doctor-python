name: Cookbook Soak

# Regression gate over the toolkit's living sample corpus (issue #428): every
# cookbook example project, scanned daily by the PUBLISHED wheel (PyPI latest).
# The checked-in baseline (scripts/cookbook_soak_baseline.json) is the FP
# alarm — a rule newly firing on the real-world corpus (cf. #426) fails this
# gate until the fix ships or the baseline is deliberately rebaselined.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

jobs:
  soak:
    name: Run the published doctor over 80 cookbook examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout doctor (script + baseline)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout cookbook examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yeongseon/azure-functions-cookbook-python
          path: cookbook
          # Living corpus: track main (findings are gated against the baseline,
          # so cookbook-side drift surfaces as an explicit rebaseline request).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the published doctor from PyPI
        run: |
          python -m venv soak-venv
          soak-venv/bin/pip install --upgrade pip
          soak-venv/bin/pip install azure-functions-doctor
          echo "doctor version: $(soak-venv/bin/azure-functions-doctor --version)"

      - name: Soak (health, contract, baseline gate)
        run: |
          PATH="$PWD/soak-venv/bin:$PATH" python scripts/soak_cookbook.py "$PWD/cookbook/examples"
