name: Azure Functions Doctor
description: Diagnose Azure Functions Python v2 projects and upload actionable SARIF findings to GitHub Code Scanning.

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Path to the Azure Functions project directory
    required: false
    default: "."
  profile:
    description: "Rule profile: 'minimal' (required checks only), 'deploy' (runtime/hosting/deployment correctness), 'development' (dev-environment checks), or 'full' (all checks)"
    required: false
    default: "deploy"
  format:
    description: "Output format: 'json', 'sarif', 'junit', or 'table'"
    required: false
    default: "json"
  output:
    description: Path to save the report file
    required: false
    default: "doctor-report.json"
  python-version:
    description: Python version to use for running the doctor
    required: false
    default: "3.11"
  install-project-deps:
    description: Install project requirements.txt before running checks
    required: false
    default: "false"
  upload-artifact:
    description: Upload the report as a GitHub Actions artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: "doctor-report"
  upload-sarif:
    description: Upload SARIF report to GitHub Code Scanning (requires format=sarif and security-events:write permission)
    required: false
    default: "false"
  sarif-category:
    description: Category label for the SARIF upload
    required: false
    default: "azure-functions-doctor"
  fail-on-warn:
    description: Exit with code 1 if any warnings are found (in addition to failures)
    required: false
    default: "false"
  version:
    description: "Version of azure-functions-doctor to install: 'latest' (floor-pinned to the current minor, e.g. >=0.19,<1), 'local' (editable install from the repo checkout), or an exact pin (e.g. '0.19.2')"
    required: false
    default: "latest"

outputs:
  exit-code:
    description: Exit code from the doctor run (0 = pass, 1 = failures found)
    value: ${{ steps.run-doctor.outputs.exit_code }}
  report-path:
    description: Absolute path to the generated report file
    value: ${{ steps.run-doctor.outputs.report_path }}
  failed-count:
    description: Number of failed checks
    value: ${{ steps.run-doctor.outputs.failed_count }}
  warned-count:
    description: Number of warned checks
    value: ${{ steps.run-doctor.outputs.warned_count }}
  passed-count:
    description: Number of passed checks
    value: ${{ steps.run-doctor.outputs.passed_count }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install azure-functions-doctor
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        if [ "$INPUT_VERSION" = "latest" ]; then
          # Bound package compatibility; dependency resolution and pip upgrades
          # remain mutable and are not a reproducible-install guarantee.
          pip install "azure-functions-doctor>=0.19,<1"
        elif [ "$INPUT_VERSION" = "local" ]; then
          pip install -e .
        else
          pip install "azure-functions-doctor==$INPUT_VERSION"
        fi

    - name: Install project dependencies
      if: inputs.install-project-deps == 'true'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        if [ -f "$INPUT_PATH/requirements.txt" ]; then
          pip install -r "$INPUT_PATH/requirements.txt"
        fi

    - name: Run azure-functions-doctor
      id: run-doctor
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
      run: |
        set +e
        FORMAT="$INPUT_FORMAT"
        OUTPUT="$INPUT_OUTPUT"
        # upload-sarif implies SARIF: auto-promote instead of silently
        # skipping the upload step (the old no-op defect class) (#398).
        if [ "$INPUT_UPLOAD_SARIF" = "true" ] && [ "$FORMAT" != "sarif" ]; then
          echo "::warning::upload-sarif=true requires SARIF; promoting format from '$FORMAT' to 'sarif' and output to 'doctor-report.sarif'."
          FORMAT="sarif"
          case "$OUTPUT" in
            *.sarif) ;;
            *) OUTPUT="doctor-report.sarif" ;;
          esac
        fi
        SUMMARY_FILE=$(mktemp /tmp/doctor-summary-XXXXXX.json)
        azure-functions-doctor doctor \
          --path "$INPUT_PATH" \
          --profile "$INPUT_PROFILE" \
          --format "$FORMAT" \
          --output "$OUTPUT" \
          --summary-json "${SUMMARY_FILE}"
        DOCTOR_EXIT=$?

        echo "exit_code=${DOCTOR_EXIT}" >> "$GITHUB_OUTPUT"
        OUTPUT="$OUTPUT" python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import os
        from pathlib import Path
        output = os.environ["OUTPUT"]
        if any(ord(char) < 32 or ord(char) == 127 for char in output):
            print("report_path=")
            print("output_path=")
        else:
            print("report_path=" + str(Path(output).absolute()))
            print("output_path=" + output)
        PY

        # Parse counts from the format-independent summary JSON
        FAILED=0
        WARNED=0
        PASSED=0
        SUMMARY_VALID=false
        if [ -f "${SUMMARY_FILE}" ]; then
          COUNTS=$(SUMMARY_FILE="$SUMMARY_FILE" python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import stat
        try:
            path = Path(os.environ["SUMMARY_FILE"])
            if path.is_symlink() or not stat.S_ISREG(path.lstat().st_mode):
                raise OSError()
            flags = os.O_RDONLY | getattr(os, "O_NONBLOCK", 0) | getattr(os, "O_NOFOLLOW", 0)
            with os.fdopen(os.open(path, flags), "rb") as stream:
                info = os.fstat(stream.fileno())
                if not stat.S_ISREG(info.st_mode) or info.st_size > 4 * 1024 * 1024:
                    raise OSError()
                raw = stream.read(4 * 1024 * 1024 + 1)
            if len(raw) > 4 * 1024 * 1024:
                raise OSError()
            data = json.loads(raw)
            if not isinstance(data, dict):
                raise ValueError()
            counts = [data.get(key, 0) for key in ("failed", "warned", "passed")]
            if any(type(value) is not int or not 0 <= value <= 1000000 for value in counts):
                raise ValueError()
            print(*counts)
        except (OSError, ValueError, RecursionError, MemoryError):
            print("unavailable unavailable unavailable")
        PY
          )
          read -r FAILED WARNED PASSED <<< "$COUNTS"
          if [ "$FAILED" != "unavailable" ]; then SUMMARY_VALID=true; fi
          rm -f "${SUMMARY_FILE}"
        else
          FAILED=unavailable
          WARNED=unavailable
          PASSED=unavailable
        fi
        echo "summary_valid=$SUMMARY_VALID" >> "$GITHUB_OUTPUT"
        if [ "$SUMMARY_VALID" != "true" ]; then
          echo "::warning::Doctor summary unavailable; inspection counts could not be read safely."
        fi
        echo "failed_count=${FAILED}" >> "$GITHUB_OUTPUT"
        echo "warned_count=${WARNED}" >> "$GITHUB_OUTPUT"
        echo "passed_count=${PASSED}" >> "$GITHUB_OUTPUT"

        # Fail-on-warn logic
        if [ "$INPUT_FAIL_ON_WARN" = "true" ] && [ "${WARNED}" != "0" ]; then
          exit 1
        fi

        exit $DOCTOR_EXIT

    - name: Upload report artifact
      if: inputs.upload-artifact == 'true' && always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run-doctor.outputs.output_path }}
        if-no-files-found: warn

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        # The (possibly promoted) SARIF output resolved by the run step.
        sarif_file: ${{ steps.run-doctor.outputs.output_path }}
        category: ${{ inputs.sarif-category }}
